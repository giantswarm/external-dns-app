{{- if .Values.crd.install }}
{{- if .Values.ciliumNetworkPolicy.enabled }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "external-dns.crdInstaller.name" . }}
  namespace: {{ include "external-dns.namespace" . }}
  annotations:
    {{- include "external-dns.crdInstaller.annotations" . | nindent 4 }}
    "helm.sh/hook-weight": "-5"
  labels:
    {{- include "external-dns.crdInstaller.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "external-dns.crdInstaller.selectorLabels" . | nindent 6 }}
  egress:
    - toEntities:
        - kube-apiserver
{{- else }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "external-dns.crdInstaller.name" . }}
  namespace: {{ include "external-dns.namespace" . }}
  annotations:
    {{- include "external-dns.crdInstaller.annotations" . | nindent 4 }}
    "helm.sh/hook-weight": "-5"
  labels:
    {{- include "external-dns.crdInstaller.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "external-dns.crdInstaller.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - ports:
    - port: 443
      protocol: TCP
    - port: 6443
      protocol: TCP
{{- end }}
{{- end }}
